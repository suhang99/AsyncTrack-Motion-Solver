[workspace]
authors = [
  "Ericsii <ericfengx@foxmail.com>",
  "suhang99 <suhang@shanghaitech.edu.cn>",
]
channels = ["conda-forge"]
name = "AsyncTrack-Motion-Solver"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"
license = "Apache-2.0"

[tasks]
generate = { cmd = [
  "cmake",
  "-S",
  ".",
  "-B",
  "build",
  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
] }
build = { cmd = ["cmake", "--build", "build", "-j"], depends-on = ["generate"] }

[dependencies]
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
eigen = ">=3.4.0,<4"
ceres-solver = ">=2.2.0,<3"
libgomp = ">=15.1.0,<16"
libopencv = ">=4.12.0,<5"
yaml-cpp = ">=0.8.0,<0.9"
rerun-sdk = ">=0.24.1,<0.25"
librerun-sdk = ">=0.24.1,<0.25"
